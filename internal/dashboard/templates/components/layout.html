{{define "head"}}
<!DOCTYPE html>
<html lang="en" data-theme="clean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Orchestra Dashboard</title>
  <link rel="preload" href="/static/fonts/manrope-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/space-grotesk-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/animations.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>
  <nav class="top-nav">
    <a href="/" class="nav-brand">
      <span class="nav-logo"></span>
      Orchestra
    </a>
    <div class="nav-tabs">
      <a href="/" class="nav-tab">Factory</a>
      <a href="/git/latest" class="nav-tab">Git</a>
      <a href="/config" class="nav-tab">Configuration</a>
      <a href="/artifacts" class="nav-tab">Artifacts</a>
      <a href="/briefing" class="nav-tab">Briefing</a>
    </div>
    <div class="nav-right">
      <div hx-get="/api/nav-status" hx-trigger="load, every 5s" hx-swap="innerHTML" style="display:flex;align-items:center;gap:8px"></div>
      <button class="nav-search">
        <span>Search...</span>
        <kbd>Cmd+K</kbd>
      </button>
    </div>
  </nav>
  <main id="main" class="main-content">
{{end}}

{{define "foot"}}
  </main>
  <div class="toast-container" id="toast-container"></div>
  <script src="/static/app.js"></script>
  <script>
  (function() {
    var path = window.location.pathname.replace(/\/+$/, '') || '/';
    document.querySelectorAll('.nav-tab').forEach(function(tab) {
      var href = tab.getAttribute('href').replace(/\/+$/, '') || '/';
      if (path === href || (href !== '/' && path.startsWith(href))) {
        tab.classList.add('active');
      }
    });
  })();
  </script>
</body>
</html>
{{end}}
